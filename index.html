<!DOCTYPE html>
<html lang="cs-cz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kredit Clicker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="img/upol.png" type="image/x-icon">
    <script src="script.js" defer></script>
</head>
<body>
    <img src="img/logo.png">
    <h2>by: Adam "Adamus" Fiala 2026</h2>

    
    <img src="img/upol.png" onclick="btnClick()" id="clicker">

    <br>
    <br>

    <div class="counters">
        <p id="pocitadlo">Počet kreditů: 0.0</p>
        <p id="silaPocitadlo">Síla kliku: 1</p>
        <p id="upgradePocitadlo">Automatické kredity: 0/s</p>
    </div>
    
    
    <div class="button-mouse">
        <hr>
        <button id="upMys" onclick="mouseUpgrade()""><img src="img/mouse.png" height="25px"> </button><br> 
    </div>
    

    <div class="button-auto">
        <hr>
        <button id="up1" onclick="up1f()">Úvod do diskrétních struktur (15 kreditů) | +0.1/s </button> <br>
        <button id="up2" onclick="up2f()">Struktura počítačů (100 kreditů) | +1/s</button> <br>
        <button id="up3" onclick="up3f()">Algoritmizace (1100 kreditů) | +8/s</button> <br>
        <button id="up4" onclick="up4f()">Základy programování (12000 kreditů) | +47/s</button> <br>
        <button id="up5" onclick="up5f()">Unixové systémy (130000 kreditů) | +260/s</button> <br>
        <button id="up6" onclick="up6f()">Matematické repetitorium (1400000 kreditů) | +1400/s</button> <br>
        <button id="up7" onclick="up7f()">Paradigma programování (20000000 kreditů) | +7800/s</button> <br> <br>
        <hr>
    </div>
    
    <div class="button-mouse">
        <button onclick="resetovat()"><img src="img/reset.png" height="20px"> Resetování hry</button>
    </div>
</body>
</html>
